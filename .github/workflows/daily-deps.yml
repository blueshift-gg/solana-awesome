name: daily-deps

# Every 24 hours: check crates.io for newer solana-* releases, raise the
# Cargo.toml version requirements as far as the ecosystem's internal pins
# allow (scripts/bump_requirements.py), bump the package version, validate
# the full feature matrix (scripts/test-features.sh all), and open a PR with
# the diff — ready to merge and tag (pushing the tag runs
# .github/workflows/release.yml, which publishes) so solana-awesome always
# tracks the latest solana crates. No standing `cargo update` churn: the
# lockfile only moves when the requirements do.

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: daily-deps
  cancel-in-progress: false

jobs:
  catch-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: daily-deps

      - name: Bump requirements to the latest resolvable solana crates
        id: bump
        run: |
          python3 scripts/bump_requirements.py | tee bump-report.md >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet Cargo.toml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate the full feature matrix
        if: steps.bump.outputs.changed == 'true'
        # Every suite: the ci gate (--all-features, full, no features), each
        # group / leaf / pass-through feature on its own, and the
        # single-wincode tree check. Same script as ci.yml and local runs.
        run: scripts/test-features.sh all

      - name: Dry-run publish
        if: steps.bump.outputs.changed == 'true'
        run: cargo publish --dry-run --allow-dirty

      - name: Prepare PR body
        if: steps.bump.outputs.changed == 'true'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml','rb'))['package']['version'])")
          {
            cat bump-report.md
            echo
            echo "---"
            echo "Validated in [this run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}):"
            echo '- `scripts/test-features.sh all` (ci gate, groups, leaves, pass-throughs, single `wincode` version)'
            echo '- `cargo publish --dry-run`'
            echo
            echo "Merge, then tag the merge commit to publish (the tag must match \`package.version\`):"
            echo
            echo '```sh'
            echo "git tag -a v${version} -m \"Release v${version}\" && git push origin v${version}"
            echo '```'
            echo
            echo "See README → Release; \`.github/workflows/release.yml\` validates and publishes."
          } > pr-body.md

      - name: Open a PR with the catch-up diff
        if: steps.bump.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: |
            Cargo.toml
            Cargo.lock
          branch: automated/catch-up
          delete-branch: true
          commit-message: "chore: catch up to latest solana crates"
          title: "chore: catch up to latest solana crates"
          body-path: pr-body.md

      - name: Report new solana-* crates and anything else pending
        if: always()
        run: |
          {
            echo "## crates.io report (new crates need a manual /update-crates pass)"
            python3 scripts/check_crates.py
          } >> "$GITHUB_STEP_SUMMARY"
