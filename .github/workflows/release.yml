name: Release

on:
  push:
    tags: ["v*"]

run-name: "Release ${{ github.ref_name }}"

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release

      - name: Build and test the full feature matrix
        run: scripts/test-features.sh all

      - name: Dry-run publish
        run: cargo publish --dry-run

  crates:
    name: Publish crates
    needs: validate
    permissions:
      contents: write
      id-token: write
    uses: blueshift-gg/github-actions/.github/workflows/release-crates.yml@master
    with:
      tag: ${{ github.ref_name }}
      environment: release
      timeout-minutes: 15
    secrets: inherit
